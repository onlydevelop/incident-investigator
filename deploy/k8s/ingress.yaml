# Traefik (bundled with k3s) on localhost:80. *.localhost resolves to 127.0.0.1 in curl and browsers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
spec:
  ingressClassName: traefik
  rules:
    - host: orders.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port: {name: http}
    - host: market-data.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: symbols-api
                port: {name: http}
