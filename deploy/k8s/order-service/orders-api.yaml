apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the images' `app` user
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: orders-api
          image: order-service/order-service:local
          imagePullPolicy: Never
          command: ["order-service-api"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: postgres-credentials
          env:
            # Built from the secret's variables above.
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # /health queries Postgres, so the pod only gets traffic once Postgres is reachable.
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 6  # the pool waits up to 5s for Postgres
          livenessProbe:
            # Liveness must not depend on Postgres, or a database outage would restart this pod.
            httpGet: {path: /docs, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
