# Creates the topics once Kafka accepts connections. Existing topics are left alone, so it's safe
# to rerun: the Job deletes itself after 5 minutes, and the next `kubectl apply -k` runs it again.
# Keep the list in sync with TOPICS in ../../../infra/Makefile.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:4.1.0
          env:
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx128m"}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              bin=/opt/kafka/bin
              until $bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1; do
                echo "waiting for kafka:9092"; sleep 3
              done
              for t in market-data.ticker:3; do
                $bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "${t%%:*}" --partitions "${t##*:}" --replication-factor 1
                echo "topic ${t%%:*}"
              done
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 384Mi}
