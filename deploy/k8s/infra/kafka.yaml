# Single-node KRaft broker, configured like ../../../infra/docker-compose.yml.
# Headless, so `kafka` resolves straight to the pod and the advertised kafka:9092 is reachable.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Required: the image turns every KAFKA_* variable into broker config, and service links
      # would inject KAFKA_PORT=tcp://... and friends, which breaks startup.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000  # the image runs as appuser (1000); lets it write the volume
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - name: kafka
              containerPort: 9092
          env:
            # Base64 UUID used to format the log dir on first start; changing it needs a fresh volume.
            - {name: CLUSTER_ID, value: VtZE8sDoTtuCjJ92B4I1Kw}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            # Topics are created by the kafka-topics Job, so a typo can't create a new one.
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          # TCP checks: an exec probe would start a second JVM inside the memory limit every period.
          startupProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
