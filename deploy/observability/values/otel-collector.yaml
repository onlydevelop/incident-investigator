# One collector per node (a DaemonSet): it tails every pod's log files and receives OTLP from apps,
# then sends logs to Loki, traces to Tempo and metrics to Prometheus. Apps point
# OTEL_EXPORTER_OTLP_ENDPOINT at http://otel-collector.observability:4318 (or :4317 for gRPC).
mode: daemonset
fullnameOverride: otel-collector

image:
  # The Kubernetes distribution: filelog, k8sattributes and the OTLP exporters, without the rest of contrib.
  repository: otel/opentelemetry-collector-k8s

presets:
  # filelog receiver on /var/log/pods, parsed into one record per line with namespace/pod/container.
  logsCollection:
    enabled: true
    storeCheckpoints: true  # resume where it left off after a restart instead of re-reading or skipping
  # Adds k8s.deployment.name, k8s.pod.name etc. to logs, traces and metrics, and sets service.name
  # from the app's labels when the SDK didn't.
  kubernetesAttributes:
    enabled: true

ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  metrics: {enabled: true}  # the collector's own otelcol_* metrics on :8888, scraped by the PodMonitor

# The otel-collector Service apps send to. internalTrafficPolicy is Local for a DaemonSet, so each
# app talks to the collector on its own node.
service:
  enabled: true

podMonitor:
  enabled: true

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 384Mi}  # GOMEMLIMIT follows this, and memory_limiter refuses data at 80% of it

config:
  receivers:
    # Remove the chart's defaults that nothing here sends.
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    # The apps in incident-investigator log JSON lines (see the services' telemetry.py). Lift their
    # fields (event, symbol, reason, ...) into attributes, which Loki keeps as structured metadata,
    # and set the record's trace and span IDs so Grafana links each line to its trace. The body
    # stays the original line, so `| json` in LogQL works too.
    transform/json_logs:
      error_mode: ignore
      log_statements:
        - conditions:
            - resource.attributes["k8s.namespace.name"] == "incident-investigator" and IsMatch(log.body, "^\\{")
          statements:
            - merge_maps(log.cache, ParseJSON(log.body), "upsert")
            - set(log.trace_id.string, log.cache["trace_id"]) where log.cache["trace_id"] != nil
            - set(log.span_id.string, log.cache["span_id"]) where log.cache["span_id"] != nil
            - set(log.severity_text, ToUpperCase(log.cache["level"])) where log.cache["level"] != nil
            - delete_matching_keys(log.cache, "^(time|message|trace_id|span_id|level|exception)$")
            - merge_maps(log.attributes, log.cache, "upsert")
  exporters:
    otlp_http/loki:
      endpoint: http://loki.observability:3100/otlp
    otlp_grpc/tempo:
      endpoint: tempo.observability:4317
      tls: {insecure: true}
    otlp_http/prometheus:
      metrics_endpoint: http://kube-prometheus-stack-prometheus.observability:9090/api/v1/otlp/v1/metrics
      tls: {insecure: true}
  service:
    pipelines:
      logs:
        receivers: [otlp]  # the logsCollection preset adds filelog
        processors: [memory_limiter, transform/json_logs, batch]
        exporters: [otlp_http/loki]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/prometheus]
