# Loki as one process (single binary) on a local volume: no object storage, no caches, no gateway.
# Logs arrive over OTLP from the OTel Collector at http://loki.observability:3100/otlp.
deploymentMode: SingleBinary

loki:
  auth_enabled: false  # single tenant ("fake"); nothing outside the cluster can reach it but the ingress
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    volume_enabled: true  # for Grafana's Logs Drilldown
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true  # log patterns in Logs Drilldown
  ingester:
    chunk_encoding: snappy

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

# The scalable and microservice targets, which SingleBinary replaces.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomPlanner: {replicas: 0}
bloomBuilder: {replicas: 0}
bloomGateway: {replicas: 0}

gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
minio: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
# Prometheus scrapes Loki through the ServiceMonitor in ../extras.yaml; this chart version has none.
