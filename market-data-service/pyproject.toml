[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-ticker"
version = "0.1.0"
description = "Streams Delta Exchange v2/ticker updates as Kafka-ready payloads"
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.9,<2",
    "redis>=6,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
delta-ticker = "delta_ticker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
