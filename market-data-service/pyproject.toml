[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-ticker"
version = "0.1.0"
description = "Streams Delta Exchange v2/ticker updates to Kafka and Redis"
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.9,<2",
    "redis>=6,<9",
    "confluent-kafka>=2.6,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "httpx2>=2", "fakeredis>=2.26"]

[project.scripts]
delta-ticker = "delta_ticker.__main__:main"
delta-ticker-api = "delta_ticker.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["delta_ticker"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    'if __name__ == "__main__":',
]
# Floor, not target: currently 82%. __main__.py (wiring) and the websocket callbacks in client.py are
# untested. Raise this as tests are added; `make coverage` and CI fail below it.
fail_under = 80
