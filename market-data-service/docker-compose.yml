services:
  redis:
    image: redis:8
    container_name: market-data-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  delta-ticker:
    build:
      context: .
      target: runtime
    image: market-data/delta-ticker
    container_name: delta-ticker
    restart: unless-stopped
    # Python as PID 1 ignores SIGTERM; tini forwards it so `stop` is immediate.
    init: true
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  symbols-api:
    # Same image as the ticker, different command.
    build:
      context: .
      target: runtime
    image: market-data/delta-ticker
    container_name: symbols-api
    restart: unless-stopped
    init: true
    command: ["delta-ticker-api"]
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
