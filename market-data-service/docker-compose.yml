services:
  redis:
    image: redis:8
    container_name: market-data-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  delta-ticker:
    build: .
    image: market-data/delta-ticker
    container_name: delta-ticker
    restart: unless-stopped
    # Python as PID 1 ignores SIGTERM; tini forwards it so `stop` is immediate.
    init: true

volumes:
  redis-data:
