# Redis and kafka (and postgres) run in the shared infra stack: ../infra/docker-compose.yml.
# Start it first (`make up` does); these containers reach it over the `portfolio` network.
services:
  delta-ticker:
    build:
      context: .
      target: runtime
    image: market-data/delta-ticker
    container_name: delta-ticker
    restart: unless-stopped
    # Python as PID 1 ignores SIGTERM; tini forwards it so `stop` is immediate.
    init: true
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Logs every tick, so `make ticker-logs` shows data flowing. On k3s it's INFO, and metrics count ticks.
      LOG_LEVEL: DEBUG

  symbols-api:
    # Same image as the ticker, different command.
    build:
      context: .
      target: runtime
    image: market-data/delta-ticker
    container_name: symbols-api
    restart: unless-stopped
    init: true
    command: ["delta-ticker-api"]
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
    name: portfolio
    external: true
