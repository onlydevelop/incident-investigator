# --- Cross-section: a diagnosis and the action it leads to, in different sections ---
- id: q53
  question: "Redis evictions keep climbing and orders fail with NO_PRICE. How do I confirm it is memory and what do I do?"
  kind: cross-section
  answers:
    - doc: RB-006
      evidence: ["Evictions rising: memory problem", "Delete the unbounded key family"]
- id: q54
  question: "A pod keeps getting OOMKilled. How do I tell a leak from a burst, and how do I stop the crash loop?"
  kind: cross-section
  answers:
    - doc: RB-009
      evidence: ["Steady climb over hours: leak", "Raise the memory limit to stop the loop"]
- id: q55
  question: "Pods on one node reject everything as STALE_PRICE while the feed is healthy. What is the cause and how do I recover?"
  kind: cross-section
  answers:
    - doc: RB-012
      evidence: ["every tick looks old", "Cordon the node and move pods off it"]
- id: q56
  question: "Market-data logs show KafkaStorageException. What should I check and how do I fix it?"
  kind: cross-section
  answers:
    - doc: RB-007
      evidence: ["go straight to broker disk usage", "Disk full: lower retention on `md.ticks.v1`"]
- id: q57
  question: "In the Redis restart incident, what misled the diagnosis and what did we change in the runbook?"
  kind: cross-section
  answers:
    - doc: PM-005
      evidence: ["The first check (evictions) was the wrong one", "RB-006 triage now checks uptime reset alongside evictions"]
