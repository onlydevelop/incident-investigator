# Retrieval eval set for the incident corpus.
#
# Each question lists one or more acceptable answers. A retrieved chunk answers the question if it comes
# from that answer's document and contains every one of its evidence snippets (compared case-insensitively,
# whitespace collapsed). Evidence is copied verbatim from the corpus; the loader rejects snippets that are
# not in the document, so edits to the corpus that break a question fail loudly.
#
# kind:
#   single-section: all evidence sits in one section of the document.
#   cross-section:  evidence spans two sections (e.g. a triage step and its mitigation), so a chunk must
#                   cover both to count.
#
# These questions are about what the corpus says. They are not the agent's golden-set incidents, which
# stay out of the corpus (see incident-corpus/README.md, "Keeping evals honest").

# --- RB-001: Stale market data / WebSocket feed down ---
- id: q01
  question: "Prices aren't moving, the ticker pod has restarted several times, and the stale-data alert is silent. What case is this?"
  kind: single-section
  answers:
    - doc: RB-001
      evidence: ["Metrics absent, pod restarting"]
    - doc: PM-001
      evidence: ["`MarketDataStale` never fires"]
- id: q02
  question: "md_ws_connected is 1 but no ticks are arriving. What does that mean?"
  kind: single-section
  answers:
    - doc: RB-001
      evidence: ["Connected but no ticks received", "The client sends no pings"]
    - doc: PM-003
      evidence: ["`md_ws_connected` stayed at 1"]
- id: q03
  question: "Can I run two delta-ticker replicas for redundancy?"
  kind: single-section
  answers:
    - doc: RB-001
      evidence: ["Never scale delta-ticker above 1 replica"]
- id: q04
  question: "One option symbol stopped ticking. How do I tell whether it expired, and what should I do about it?"
  kind: cross-section
  answers:
    - doc: RB-001
      evidence: ["last six digits of a symbol are its expiry date", "only after checking that no open or pending position uses them"]

# --- RB-002: position-updater lag ---
- id: q05
  question: "Position updates are running behind. Does that make entry prices wrong?"
  kind: single-section
  answers:
    - doc: RB-002
      evidence: ["Entry prices stay correct"]
- id: q06
  question: "Consumer lag shows -1 on one partition. Is that lag?"
  kind: single-section
  answers:
    - doc: RB-002
      evidence: ["has never committed on that partition", "never `sum` the raw series"]
- id: q07
  question: "How many position-updater replicas can usefully consume the ticker topic?"
  kind: single-section
  answers:
    - doc: RB-002
      evidence: ["scale to at most 3 replicas, one per partition"]

# --- RB-003: orders-api latency ---
- id: q08
  question: "Why does a slow symbols-api make orders-api's GET requests slow too?"
  kind: single-section
  answers:
    - doc: RB-003
      evidence: ["keeps its Postgres transaction open while it calls symbols-api"]
- id: q09
  question: "Position creates are timing out. Should I raise MARKET_DATA_TIMEOUT_SECONDS?"
  kind: single-section
  answers:
    - doc: RB-003
      evidence: ["Do not raise `MARKET_DATA_TIMEOUT_SECONDS`"]
- id: q10
  question: "A slow POST /positions trace shows a gap before the INSERT starts. What does that mean and what should I do?"
  kind: cross-section
  answers:
    - doc: RB-003
      evidence: ["| Gap before `INSERT` starts | Waiting for a pool connection (5 per process) | RB-005 |", "Pool waits with a healthy symbols-api: follow RB-005."]

# --- RB-004: orders-api errors ---
- id: q11
  question: "Creating a position returned 502. Was anything stored, and can the client retry?"
  kind: single-section
  answers:
    - doc: RB-004
      evidence: ["A 502 is all or nothing", "the client can simply retry"]
- id: q12
  question: "orders-api is throwing errors. Are existing positions still being priced?"
  kind: single-section
  answers:
    - doc: RB-004
      evidence: ["Existing positions keep updating during orders-api errors"]
- id: q13
  question: "orders.localhost returns a 503 with no JSON body. What does that mean?"
  kind: single-section
  answers:
    - doc: RB-004
      evidence: ["`503` from Traefik with no JSON body", "No ready orders-api pod"]

# --- RB-005: PostgreSQL pool exhaustion ---
- id: q14
  question: "The apps log 'sorry, too many clients already'. What limit was hit?"
  kind: single-section
  answers:
    - doc: RB-005
      evidence: ["sorry, too many clients already", "max_connections=100"]
- id: q15
  question: "The DB pool is saturated. Can I just add more orders-api replicas?"
  kind: single-section
  answers:
    - doc: RB-005
      evidence: ["Never raise replicas without recalculating total connections"]
    - doc: RB-005
      evidence: ["Scaling replicas can itself cause this incident"]
- id: q16
  question: "How do I kill a Postgres session that is holding a lock?"
  kind: single-section
  answers:
    - doc: RB-005
      evidence: ["pg_terminate_backend"]
- id: q17
  question: "pg_stat_activity shows no application names. How do I find which pod holds the connections?"
  kind: single-section
  answers:
    - doc: RB-005
      evidence: ["group by `client_addr` and match it to pod IPs"]

# --- RB-006: Redis ---
- id: q18
  question: "Redis is down. Will positions stop updating?"
  kind: single-section
  answers:
    - doc: RB-006
      evidence: ["Nothing in the position path reads Redis"]
- id: q19
  question: "A ticker key is missing from Redis. Was it evicted?"
  kind: single-section
  answers:
    - doc: RB-006
      evidence: ["evictions stay at 0 without `maxmemory`"]
- id: q20
  question: "How do I check that every position's symbol is still subscribed?"
  kind: single-section
  answers:
    - doc: RB-006
      evidence: ["SMEMBERS ticker:symbols", "SELECT DISTINCT symbol FROM positions ORDER BY 1"]

# --- RB-007: Kafka broker / producer errors ---
- id: q21
  question: "Ticks received keeps rising but ticks published is flat, while /tickers is fresh. Where is the fault?"
  kind: single-section
  answers:
    - doc: RB-007
      evidence: ["This split is a strong signal the problem is in Kafka, not the feed"]
- id: q22
  question: "delta-ticker logs 'Message timed out' for Kafka. Are those ticks sent later?"
  kind: single-section
  answers:
    - doc: RB-007
      evidence: ["Those ticks are dropped, not replayed"]
- id: q23
  question: "Which query shows how full the Kafka broker's volume is?"
  kind: single-section
  answers:
    - doc: RB-007
      evidence: ["kubelet_volume_stats_used_bytes{persistentvolumeclaim=\"data-kafka-0\"}"]

# --- RB-008: Positions stuck in pending ---
- id: q24
  question: "A sell position on a deep out-of-the-money option stays pending even though ticks arrive. Why?"
  kind: single-section
  answers:
    - doc: RB-008
      evidence: ["`best_bid: null` keeps sells waiting", "Deep out-of-the-money options often have no bid"]
- id: q25
  question: "Is it safe to leave a position pending? Could it open at an old price?"
  kind: single-section
  answers:
    - doc: RB-008
      evidence: ["A position never opens at a price older than its creation time"]
- id: q26
  question: "A pending position's symbol isn't listed on Delta. What should I do?"
  kind: single-section
  answers:
    - doc: RB-008
      evidence: ["Expired or never listed: the position will never open"]

# --- RB-009: CrashLoopBackOff / OOMKilled ---
- id: q27
  question: "delta-ticker shows Completed with exit code 0 and keeps restarting. Why?"
  kind: single-section
  answers:
    - doc: RB-009
      evidence: ["`run()` returns and the process ends"]
    - doc: PM-001
      evidence: ["exits with code 0"]
- id: q28
  question: "A container exited with code 137. What does that mean?"
  kind: single-section
  answers:
    - doc: RB-009
      evidence: ["`OOMKilled` (exit 137)"]
- id: q29
  question: "Why doesn't a Postgres outage restart the orders-api pods?"
  kind: single-section
  answers:
    - doc: RB-009
      evidence: ["liveness probe checks `/docs`", "a database outage never restarts them"]

# --- RB-010: Bad release rollback ---
- id: q30
  question: "I ran kubectl rollout undo after a bad make deploy and the bug is still there. Why?"
  kind: single-section
  answers:
    - doc: RB-010
      evidence: ["So `rollout undo` does not roll back code."]
- id: q31
  question: "During a rolling update, how can I tell whether the new pods are the ones misbehaving?"
  kind: single-section
  answers:
    - doc: RB-010
      evidence: ["Split by pod, not version", "carry `k8s_pod_name`"]
- id: q32
  question: "Does kubectl rollout undo revert a change to app-config?"
  kind: single-section
  answers:
    - doc: RB-010
      evidence: ["`rollout undo` does revert a config-only change"]

# --- RB-011: Telemetry gap ---
- id: q33
  question: "Dashboards are flat and no alerts have fired. How do I tell a quiet system from missing telemetry?"
  kind: single-section
  answers:
    - doc: RB-011
      evidence: ["The newest data point in a panel is minutes old while the pods are clearly running"]
- id: q34
  question: "App metrics arrive but the pg_*, redis_* and consumer lag series are missing. Why?"
  kind: single-section
  answers:
    - doc: RB-011
      evidence: ["the `infra-exporters` PodMonitor isn't applied"]
    - doc: PM-007
      evidence: ["The `infra-exporters` PodMonitor is only applied when its CRD exists"]
- id: q35
  question: "md_kafka_produce_errors_total doesn't exist in Prometheus. Is telemetry broken?"
  kind: single-section
  answers:
    - doc: RB-011
      evidence: ["only appear after their first increment"]
    - doc: RB-007
      evidence: ["an absent series means zero"]

# --- RB-012: Clock skew ---
- id: q36
  question: "Tick age is negative on every symbol. Is that harmless?"
  kind: single-section
  answers:
    - doc: RB-012
      evidence: ["**Clock behind**", "hiding a real feed problem"]
- id: q37
  question: "What commands show whether a node's time is synced?"
  kind: single-section
  answers:
    - doc: RB-012
      evidence: ["timedatectl status", "chronyc tracking"]

# --- PM-001: WebSocket close crashloop ---
- id: q38
  question: "What was the root cause when delta-ticker kept restarting during Delta's maintenance window?"
  kind: single-section
  answers:
    - doc: PM-001
      evidence: ["The ticker has no reconnect loop"]
- id: q39
  question: "What reconnect behaviour is planned for the websocket?"
  kind: single-section
  answers:
    - doc: PM-001
      evidence: ["Reconnect inside the process with exponential backoff and jitter (1 s to 60 s cap)"]

# --- PM-002: Symbols cleared ---
- id: q40
  question: "Have we had an incident where someone cleared the symbol list?"
  kind: single-section
  answers:
    - doc: PM-002
      evidence: ["curl -X DELETE http://market-data.localhost/symbols"]
- id: q41
  question: "After the symbols were cleared, why did new positions work while old ones were frozen?"
  kind: single-section
  answers:
    - doc: PM-002
      evidence: ["POST /positions re-subscribes its symbol"]

# --- PM-003: Half-open websocket ---
- id: q42
  question: "The stale alert fired during the silent-websocket incident. Why did nobody notice it?"
  kind: single-section
  answers:
    - doc: PM-003
      evidence: ["Alertmanager is disabled, so it only shows on Prometheus's `/alerts` page"]
- id: q43
  question: "What websocket client setting would make a dead connection close?"
  kind: single-section
  answers:
    - doc: PM-003
      evidence: ["run_forever(ping_interval=20, ping_timeout=10)"]

# --- PM-004: Leaked connection pools ---
- id: q44
  question: "New clients got 'too many clients' but Postgres was barely doing anything. Has this happened before?"
  kind: single-section
  answers:
    - doc: PM-004
      evidence: ["Postgres was nearly idle"]
- id: q45
  question: "What did we change in the code after the connection-pool leak?"
  kind: single-section
  answers:
    - doc: PM-004
      evidence: ["closes the pool if schema creation fails"]

# --- PM-005: Ticker starts before Redis ---
- id: q46
  question: "The ticker logged 'No symbols configured yet' right after a restart, but the symbol set wasn't empty. Why?"
  kind: single-section
  answers:
    - doc: PM-005
      evidence: ["falls back to an empty list"]
    - doc: RB-006
      evidence: ["even though the set is intact"]

# --- PM-006: Kafka volume full ---
- id: q47
  question: "What filled up the Kafka broker's disk?"
  kind: single-section
  answers:
    - doc: PM-006
      evidence: ["default retention: 7 days, no size limit"]
- id: q48
  question: "When the Kafka volume filled, why did /tickers stay fresh?"
  kind: single-section
  answers:
    - doc: PM-006
      evidence: ["delta-ticker writes Redis independently of Kafka"]

# --- PM-007: Missing PodMonitor ---
- id: q49
  question: "How did one forgotten psql session stop every position from updating?"
  kind: single-section
  answers:
    - doc: PM-007
      evidence: ["the updater is single-threaded, every symbol stopped updating"]
- id: q50
  question: "What settings keep a forgotten transaction from blocking the position-updater?"
  kind: single-section
  answers:
    - doc: PM-007
      evidence: ["idle_in_transaction_session_timeout"]
    - doc: PM-007
      evidence: ["lock_timeout"]

# --- PM-008: VM clock behind ---
- id: q51
  question: "Why did position_updater_tick_age_seconds look perfectly fresh while the clock was wrong?"
  kind: single-section
  answers:
    - doc: PM-008
      evidence: ["it clamps negative ages to 0"]
- id: q52
  question: "How far behind was the VM clock after the host slept?"
  kind: single-section
  answers:
    - doc: PM-008
      evidence: ["455 s behind"]

# --- Cross-section: a diagnosis and the action it leads to, in different sections ---
- id: q53
  question: "symbols-api returns 503 and every POST /positions gets 502. What is going on, and how do I restore subscriptions if the set is empty?"
  kind: cross-section
  answers:
    - doc: RB-006
      evidence: ["symbols-api returns 503 `Redis unavailable: ...`", "Re-subscribe symbols from the positions table"]
- id: q54
  question: "A pod keeps getting OOMKilled. How do I tell a leak from a burst, and how do I stop the crash loop?"
  kind: cross-section
  answers:
    - doc: RB-009
      evidence: ["Steady climb over hours: a leak", "Raise the memory limit to stop the loop"]
- id: q55
  question: "Every symbol looks stale and new positions stay pending, but ticks are flowing. What is the cause and how do I recover?"
  kind: cross-section
  answers:
    - doc: RB-012
      evidence: ["every tick looks old", "Step the VM clock"]
- id: q56
  question: "The Kafka broker logs 'No space left on device'. What should I check and how do I fix it?"
  kind: cross-section
  answers:
    - doc: RB-007
      evidence: ["go straight to disk usage", "Disk full: set a short `retention.ms` on `market-data.ticker`"]
- id: q57
  question: "In the ticker-before-Redis incident, what misled the diagnosis and what did we change in the runbooks?"
  kind: cross-section
  answers:
    - doc: PM-005
      evidence: ["pointing the operator at the symbol list instead of at Redis", "RB-001 and RB-006 describe this log sequence as a Redis problem"]
