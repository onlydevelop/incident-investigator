[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "order-service"
version = "0.1.0"
description = "Paper-trading positions in Postgres, priced from market-data-service's Kafka ticker feed"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.53.0,<1",
    "psycopg[binary,pool]>=3.3.6,<4",
    "confluent-kafka>=2.15.1,<3",
    "httpx>=0.28.1,<1",
    # Traces and metrics over OTLP (see telemetry.py). The instrumentation packages are versioned
    # together with the SDK: 0.Nb0 goes with 1.(N-21).
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-psycopg>=0.66b0",
]

[project.optional-dependencies]
# httpx2 is what FastAPI's TestClient uses; the service itself uses httpx.
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "httpx2>=2.13.0"]

[project.scripts]
order-service-api = "order_service.api:main"
order-service-updater = "order_service.updater:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
order_service = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: needs the shared Postgres (every test that uses the `store` fixture)",
]

[tool.coverage.run]
source = ["order_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# `make coverage` fails below this.
fail_under = 95
exclude_also = [
    'if __name__ == "__main__":',
]
